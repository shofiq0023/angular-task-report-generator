<div class="mb-1">
    @if (!usernameEditing) {
        <div class="username-trigger d-inline-flex" (click)="startEditingUsername()">
            <span class="username-name">{{ username }}</span>
            <span class="username-edit-icon">
                <button class="btn btn-sm text-secondary p-0" title="Edit username" (click)="startEditingUsername()">
                    <fa-icon [icon]="pencilIcon"></fa-icon>
                </button>
            </span>
        </div>
    } @else {
        <div class="d-flex align-items-center gap-2" style="max-width: 380px;">
            <input #usernameInput
                   class="form-control username-input"
                   type="text"
                   name="username"
                   placeholder="Your name…"
                   [(ngModel)]="username"
                   (blur)="saveUsername()">
            <button class="btn btn-outline-success" title="Save" (click)="saveUsername()">
                <fa-icon class="fa-lg" [icon]="checkIcon"></fa-icon>
            </button>
            <button class="btn btn-outline-secondary" title="Cancel" (click)="endEditingUsername()">
                <fa-icon class="fa-lg" [icon]="crossIcon"></fa-icon>
            </button>
        </div>
    }
    <div class="current-date mt-1">{{ currentDate | date:'EEEE, d MMMM yyyy' }}</div>
</div>
